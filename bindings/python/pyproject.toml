[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-sdk"
version = "0.1.0"
description = "VisionForge 形状模板匹配 SDK 官方 Python 绑定（ctypes）"
requires-python = ">=3.9"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
benchmark = ["opencv-python"]

[tool.setuptools]
packages = ["shape_sdk"]
